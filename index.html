.mascot{font-size:64px;text-align:center;animation:bounce 1.6s infinite;display:block}
.title{font-size:30px;font-weight:900;text-align:center;margin:6px 0 2px;

.sub{text-align:center;color:#a58cc7;margin:0 0 14px;font-weight:700}
.bigbtn{display:block;width:100%;border:none;cursor:pointer;color:#fff;font-weight:900;

.bigbtn:active{transform:translateY(5px);box-shadow:0 1px 0 #d9539a}
.bigbtn.blue{background:linear-gradient(135deg,#8ecdff,#5aa9f5);box-shadow:0 6px 0 #3d86cc}
.bigbtn.blue:active{box-shadow:0 1px 0 #3d86cc}
.bigbtn.green{background:linear-gradient(135deg,#b7e58c,#82cf5f);box-shadow:0 6px 0 #5da13e}
.bigbtn.green:active{box-shadow:0 1px 0 #5da13e}

.bigbtn.gray:active{box-shadow:0 1px 0 #9486b5}

input.spell{width:100%;font-size:24px;font-family:'Baloo 2',sans-serif;text-align:center;padding:12px;

.row{display:flex;gap:10px}
.opt{flex:1;border:none;cursor:pointer;font-family:inherit;font-size:19px;font-weight:900;color:#5a4a78;

.tag{display:inline-block;background:#fff0f8;color:#ff6fae;font-weight:900;border-radius:999px;padding:4px 14px;margin:2px;font-size:14px}

function ensureMic(cb){
  if (MIC_STREAM && MIC_STREAM.getAudioTracks().some(function(t){return t.readyState==='live';})) { cb(true); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { cb(false); return; }

    MIC_STREAM = s;      /* 拿到權限後保留住，後面每題都不會再問 */

  }).catch(function(){ cb(false); });
}

var GAME_TITLE = 'GEPT 中級｜健康飲食單字大冒險';
var CONTENT_NOTE = '課本第 3–5 頁：35 個單字與片語＋5 個例句單字';
function sendScore(name, payload, uid, cb){
  if(!SAVE_URL){ cb(false,{msg:'老師尚未設定成績表連線；進度保存在本機'}); return; }
  var controller=new AbortController();
  var timeout=setTimeout(function(){controller.abort();},20000);
  fetch(SAVE_URL, {
    signal:controller.signal,
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({action:'save', name:name, uid:uid||'', payload:payload})
  }).then(function(r){ if(!r.ok) throw Error('HTTP '+r.status); return r.json(); })
    .then(function(j){ clearTimeout(timeout); cb(!!j.ok, j); })
    .catch(function(){ clearTimeout(timeout); cb(false, null); });
}

/* ===== 每組完成自動同步 =====
 * 同一台裝置 = 表裡同一列（UID 存在 localStorage，英文名字只當顯示） */
var UID = (function(){
  try{
    var v = localStorage.getItem('WL_UID');
    if(!v){ v = 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); localStorage.setItem('WL_UID', v); }
    return v;
  }catch(e){ return 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
})();
var SYNC = { ok:false, msg:'還沒同步', time:'' };

/* 進度保存：每完成一組把「名字＋成績」存進手機 → 關掉再開可以接著補完 */
var STORAGE_OK=true;
var REV=0;
function playerKey(name){return GAME_ID+':player:'+name.trim().toLowerCase();}
function recordID(){return UID+'｜'+S.name.trim().toLowerCase();}
function saveProgress(){
  try{
    if(S.name){
      localStorage.setItem(GAME_ID+':active',S.name);
      localStorage.setItem(playerKey(S.name),JSON.stringify({name:S.name,done:S.done,pending:!SYNC.ok,rev:REV}));
    }
  }catch(e){STORAGE_OK=false;}
}
function loadProgress(name){
  try{
    name=name||localStorage.getItem(GAME_ID+':active');
    var p=JSON.parse(localStorage.getItem(playerKey(name))||'null');
    if(p&&p.name&&p.done){S.name=p.name;S.done=p.done;REV=p.rev||0;SYNC.ok=!p.pending;return true;}
  }catch(e){STORAGE_OK=false;}
  return false;
}

function buildPayload(){
  var cells={}, total=0, cnt=0, wrong=[], firstTotal=0;
  for(var n=1;n<=3;n++) for(var g=1;g<=4;g++){
    var r=S.done['s'+n+'_'+g];
    if(r){ cells['s'+n+'_'+g]=r.score; total+=r.score; cnt++; firstTotal+=r.firstTry; }
  }
  var pct = Math.round(total/120*100);
  for(var k in S.done){
    S.done[k].details.forEach(function(dt){
      if(!dt.ok) wrong.push(WORDS[dt.w].e+'（'+WORDS[dt.w].c+'）');
    });
  }
  var comment = pct>=95?'單字王 👑 超級棒':(pct>=85?'超級棒 ⭐':(pct>=70?'很不錯 👍':(pct>=50?'繼續加油 💪':'多多練習 🌱')));
  return { cells:cells, total:total, cnt:cnt, firstTotal:firstTotal, pct:pct, comment:comment, wrongArr:Array.from(new Set(wrong)),
    payload:{ cells:cells, total:total, pct:pct, comment:comment, wrong:Array.from(new Set(wrong)).join('；'), groups:S.done, gameId:GAME_ID } };
}

var SYNC_BUSY=false, SYNC_WAIT=[];
function syncScore(cb){
  if(cb) SYNC_WAIT.push(cb);
  if(SYNC_BUSY) return;
  var d=buildPayload();
  if(!d.cnt){SYNC_WAIT.splice(0).forEach(function(fn){fn(false);});return;}
  var capturedName=S.name, capturedRev=REV;
  SYNC_BUSY=true;
  sendScore(capturedName,d.payload,recordID(),function(ok,res){
    SYNC_BUSY=false;
    var same=S.name===capturedName&&REV===capturedRev;
    if(same){
      SYNC.ok=!!(ok&&res&&res.ok);
      SYNC.msg=SYNC.ok?'☁️ 已自動存入老師的表格':(res&&res.msg||'網路同步失敗，進度已保留，將自動重試');
      SYNC.time=new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
      saveProgress();
      var state=document.getElementById('syncstate')||document.getElementById('gsync');
      if(state) state.textContent=SYNC.msg;
    }
    var waiting=SYNC_WAIT.splice(0);waiting.forEach(function(fn){fn(same&&SYNC.ok);});
    if(!same&&S.name&&totalDone())syncScore();
  });
}
window.addEventListener('online',function(){if(S.name&&totalDone()&&!SYNC.ok)syncScore();});
setInterval(function(){if(S.name&&totalDone()&&!SYNC.ok&&!SYNC_BUSY)syncScore();},30000);

/* ================= 小工具 ================= */
function rnd(n){ return Math.floor(Math.random()*n); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t;} return a; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function norm(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim(); }
function compact(s){ return norm(s).replace(/ /g,''); }
function lev(a,b){
  var m=a.length,n=b.length,d=[],i,j;
  for(i=0;i<=m;i++){ d[i]=[i]; }
  for(j=0;j<=n;j++){ d[0][j]=j; }
  for(i=1;i<=m;i++) for(j=1;j<=n;j++)
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n];
}
function matchSay(target,said){return !!norm(said)&&norm(target)===norm(said);}
function spellNorm(s){return String(s).trim().toLowerCase().replace(/\s+/g,' ');}
function key(){ return 's'+S.sec.n+'_'+(S.gid+1); }
function totalDone(){ return Object.keys(S.done).length; }
function allDone(){ return totalDone()>=12; }

/* ================= 聲音 ================= */
var AC=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function tone(freqs,dur){
  var c=ac(); if(!c) return;
  freqs.forEach(function(f,k){
    var o=c.createOscillator(), g=c.createGain(), t=c.currentTime+k*dur*0.9;
    o.type='triangle'; o.frequency.value=f;
    g.gain.setValueAtTime(0.18,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur);
  });
}
function sndRight(){ tone([880,1175,1568],0.12); }
function sndWin(){ tone([523,659,784,1047],0.15); }
function sndWrong(){ tone([220,165],0.16); }

function say(text, lang, rate){
  if(CUR_SR){
    stopRec();
    var current=S.qs[S.i];if(current)current._listening=false;
    var mic=document.getElementById('mic');if(mic){mic.classList.remove('rec');mic.textContent='🎤 按我開始錄音';}
  }
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text);
  u.lang = lang || 'en-US'; u.rate = rate || 1; u.pitch = 1.1;
  var vs = speechSynthesis.getVoices()||[], pick=null;
  for(var i=0;i<vs.length;i++){
    if(u.lang.indexOf('zh')===0 && vs[i].lang.indexOf('zh-TW')>=0){ pick=vs[i]; break; }
    if(u.lang.indexOf('en')===0 && /en[-_]US/i.test(vs[i].lang) && /female|samantha|zira|google us/i.test(vs[i].name)){ pick=vs[i]; break; }
  }
  if(!pick) for(var k=0;k<vs.length;k++){ if(vs[k].lang.indexOf(u.lang.slice(0,2))===0){ pick=vs[k]; break; } }
  if(pick) u.voice=pick;
  speechSynthesis.speak(u);
}

/* ================= 畫面 ================= */
var VIEW=0, TIMERS=[];
function later(fn,ms){var v=VIEW;var id=setTimeout(function(){if(v===VIEW)fn();},ms);TIMERS.push(id);return id;}
function go(html, after){
  VIEW++;TIMERS.forEach(clearTimeout);TIMERS=[];stopRec();
  if(window.speechSynthesis)speechSynthesis.cancel();
  app.innerHTML=html;window.scrollTo(0,0);
  var fb=document.getElementById('fb');if(fb){fb.setAttribute('aria-live','polite');fb.setAttribute('role','status');}
  if(after)after();
}

function confetti(){
  var emo=['🎉','⭐','🌟','🍬','🎈','✨','🍭'];
  for(var i=0;i<14;i++){
    (function(i){
      setTimeout(function(){
        var s=document.createElement('span');
        s.className='confetti'; s.textContent=emo[rnd(emo.length)];
        s.style.left=(rnd(96))+'vw';
        document.body.appendChild(s);
        setTimeout(function(){ s.remove(); },1500);
      }, i*60);
    })(i);
  }
}
function praise(text){
  var d=document.createElement('div'); d.className='praise'; d.textContent=text;
  document.body.appendChild(d); setTimeout(function(){ d.remove(); },1300);
}

/* ---------- 出題 ---------- */
function startGroup(){
  var g=GROUPS[S.gid], idxs=[];
  for(var i=g.a;i<g.b;i++) idxs.push(i);
  idxs=shuffle(idxs);
  S.qs=idxs.map(function(w){
    var q={w:w, ok:false, tries:0, hint:false, firstTry:false, fallback:false};
    if(S.sec.id==='listen'){
      var opts=[w], pool=[];
      for(var k=0;k<WORDS.length;k++) if(k!==w && WORDS[k].c!==WORDS[w].c) pool.push(k);
      pool=shuffle(pool).slice(0,3);
      q.opts=shuffle(opts.concat(pool));
    }
    return q;
  });
  S.i=0; nextQ();
}

/* ---------- 進度條 ---------- */
function progressHTML(){

  return '<div style="display:flex;justify-content:space-between;font-weight:900;color:#a58cc7">'+
    '<span>'+GROUPS[S.gid].icon+' 第'+(S.gid+1)+'組・'+GROUPS[S.gid].name+'</span>'+

    '<div class="pbar"><div style="width:'+pct+'%"></div></div>';
}

function nextQ(){
  if(S.i>=S.qs.length){ groupResult(); return; }
  S.tries=0; S.hint=false; S.answered=false;
  if(S.sec.id==='listen') playListen();
  else if(S.sec.id==='spell') playSpell();
  else playSpeak();
}
function goNext(){ S.i++; nextQ(); }

/* ---------- 關卡一：聽力 ---------- */
function exampleHTML(w,blank){
  if(!w.sentence)return '';
  var form=w.form||w.e, at=w.sentence.toLowerCase().indexOf(form.toLowerCase());
  var text=at<0?esc(w.sentence):esc(w.sentence.slice(0,at))+
    (blank?'<span class="sentence-blank" aria-label="填空">________</span>':'<mark>'+esc(w.sentence.slice(at,at+form.length))+'</mark>')+
    esc(w.sentence.slice(at+form.length));
  return '<div class="example" lang="en">'+text+'</div>';
}
function spellingForm(w){return w.form||w.e;}
function wordFormNote(w){
  if(spellNorm(spellingForm(w))===spellNorm(w.e))return '';
  return w.e==='consume'?'本題請填入 -ing 形式':w.e==='bacterium'?'本題請填入不規則複數':'本題請填入複數形式';
}
function listenText(w){return w.sentence?w.sentence+' The word is: '+w.e+'.':w.e;}
function playListen(){
  var q=S.qs[S.i], w=WORDS[q.w];
  var opts=q.opts.map(function(k,j){
    return '<button class="opt" data-o="'+j+'">'+esc(WORDS[k].c)+'</button>';
  }).join('');
  go(
    '<div class="card">'+progressHTML()+
      '<div style="text-align:center"><span style="font-size:40px">🎧</span></div>'+
      '<p class="mini">先聽例句，再聽題目單字／片語，選出它的中文意思。</p>'+
      '<div class="feedback" id="fb"></div>'+
      '<div style="text-align:center"><button class="iconbtn mic" id="play">🔊 聽一次</button></div>'+
      '<div class="grid2" style="margin-top:10px">'+opts+'</div>'+
    '</div>',
    function(){
      later(function(){ say(listenText(w),'en-US',0.85); },250);
      document.getElementById('play').onclick=function(){ say(listenText(w),'en-US',0.85); };
      var bs=app.querySelectorAll('[data-o]');
      for(var i=0;i<bs.length;i++){
        bs[i].onclick=function(){
          if(S.answered) return;
          var j=parseInt(this.getAttribute('data-o'),10);
          q.tries=1;
          if(q.opts[j]===q.w){
            q.ok=true; q.firstTry=true; sndRight(); confetti();
            praise(PRAISE_OK[rnd(PRAISE_OK.length)]);
            this.classList.add('right');
            document.getElementById('fb').innerHTML='<span class="ok">✔ '+esc(w.e)+' = '+esc(w.c)+'</span>';
            S.answered=true; later(goNext,1200);
          }else{
            sndWrong(); this.classList.add('wrong');
            document.getElementById('fb').innerHTML='<span class="no">再想想喔～ 再聽一次 🔊</span>';
            say(w.e);
            S.answered=true;
            later(function(){
              document.getElementById('fb').innerHTML='<span class="no">✔ 答案是 '+esc(w.c)+'</span>';
              bs[q.opts.indexOf(q.w)].classList.add('right');
            },1300);
            later(goNext,2600);
          }
        };
      }
    }
  );
}

/* ---------- 關卡二：拼字 ---------- */
function playSpell(){
  var q=S.qs[S.i], w=WORDS[q.w];
  var answer=spellingForm(w), target=compact(answer);
  go(
    '<div class="card">'+progressHTML()+
      '<div class="zhbig" style="font-size:30px">「'+esc(w.c)+'」</div>'+
      exampleHTML(w,true)+
      '<p class="mini">填入句子缺少的英文單字或片語。'+esc(wordFormNote(w))+'</p>'+
      '<div style="text-align:center"><span style="font-size:34px">✏️</span></div>'+
      '<input class="spell" id="sp" aria-label="輸入英文拼字" placeholder="type here..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="text">'+
      '<div style="text-align:center">'+
        '<button class="iconbtn" id="hear">🔊 聽一次</button>'+
        '<button class="iconbtn" id="hint">🔤 顯示提示</button>'+
      '</div>'+
      '<div id="bl" style="text-align:center;font-family:Baloo 2;font-size:22px;color:#ff8fc0;font-weight:800;min-height:28px"></div>'+
      '<button class="bigbtn blue" id="ck">送出答案 ✔</button>'+
      '<div class="feedback" id="fb"></div>'+
    '</div>',
    function(){
      var inp=document.getElementById('sp'), touched=false;inp.addEventListener('input',function(){touched=true;});
      later(function(){ inp.focus(); },200);
      /* 系統先自動唸一次英文，學生聽聲音再拼字（沒動靜會再唸一次） */
      later(function(){ say(answer); },400);
      later(function(){ if(!S.answered && !touched) say(answer); },2600);
      document.getElementById('hear').onclick=function(){ q.hint=true; say(answer); };
      document.getElementById('hint').onclick=function(){
        q.hint=true;
        document.getElementById('bl').innerHTML='💡 提示：共 '+target.length+' 個字母，「'+esc(answer[0])+'」開頭';
        say(answer);
      };
      function check(){
        if(S.answered) return;
        var v=inp.value.trim();
        if(!v) return;
        q.tries++;
        var okNow = spellNorm(v)===spellNorm(answer);
        if(okNow){
          q.ok=true; q.firstTry=(q.tries===1 && !q.hint);
          sndRight(); confetti();
          praise(PRAISE_OK[rnd(PRAISE_OK.length)]);
          document.getElementById('fb').innerHTML='<span class="ok">✔ 正確！'+esc(answer)+'</span>';
          say(answer);
          S.answered=true; later(goNext,1400);
        }else if(q.tries===1){
          sndWrong();
          document.getElementById('fb').innerHTML='<span class="no">差一點點！再試一次 💪</span>';
          document.getElementById('bl').innerHTML='🔤 '+esc(answer.replace(/[a-z0-9]/gi,function(c,k){
            return (k===0)? c : ' _ ';
          }));
          inp.value=''; inp.focus();
        }else{
          q.ok=false; sndWrong();
          document.getElementById('fb').innerHTML='<span class="no">✖ 正確拼法：'+esc(answer)+'</span>';
          S.answered=true; later(goNext,2200);
        }
      }
      document.getElementById('ck').onclick=check;
      inp.addEventListener('keydown',function(e){ if(e.key==='Enter') check(); });
    }
  );
}

/* ---------- 關卡三：錄音 ---------- */
function playSpeak(){
  var q=S.qs[S.i], w=WORDS[q.w];
  go(
    '<div class="card">'+progressHTML()+
      '<div class="wordbig">'+esc(w.e)+'</div>'+
      '<div class="zhbig">'+esc(w.c)+'</div>'+
      '<p class="mini">🎤 讀出上方單字／片語。下方原文例句可先聽再跟讀。</p>'+
      exampleHTML(w,false)+
      '<div style="text-align:center"><button class="iconbtn" id="example">📖 聽例句並跟讀</button></div>'+
      '<div style="text-align:center">'+
        '<button class="iconbtn" id="hear">🔊 先聽一次</button>'+
        '<button class="iconbtn" id="slow">🐢 慢速聽</button>'+
      '</div>'+
      '<div style="text-align:center;margin:8px 0">'+
        '<button class="iconbtn mic" id="mic">🎤 按我開始錄音</button></div>'+
      '<div class="feedback" id="fb"></div>'+
      '<div id="hintarea"></div>'+
      '<button class="iconbtn" id="skip" style="width:100%">⏭ 跳過這題</button>'+
    '</div>',
    function(){
      function model(text,rate){q._manualPlayback=true;say(text,'en-US',rate||1);}
      document.getElementById('example').onclick=function(){ model(w.sentence||w.e,0.8); };
      document.getElementById('hear').onclick=function(){ model(w.e); };
      document.getElementById('slow').onclick=function(){ model(w.e,0.6); };
      document.getElementById('skip').onclick=function(){ stopRec(); q.ok=false; q.fallback=true; q._done=true; goNext(); };
      var micBtn=document.getElementById('mic');
      micBtn.onclick=function(){ doRec(micBtn,q,w); };
      if(!MIC_STREAM){ micBtn.textContent='🎤 按我開始念（第一次會問允許）'; }
      /* 權限早已拿到 → 本題自動開始錄音，達成「只按一次、連續錄」 */
      if(MIC_STREAM){
        later(function(){
          if(!q._done && !q._listening && !q._manualPlayback && document.getElementById('mic')===micBtn) doRec(micBtn,q,w);
        }, 700);
      }
    }
  );
}

function doRec(btn,q,w){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  var fb=document.getElementById('fb');
  if(!SR){
    fb.innerHTML='<span class="no">這台裝置不支援語音辨識 😢</span>';
    document.getElementById('hintarea').innerHTML=
      '<div class="hintbox">請大聲念 3 次給自己聽，然後按下面按鈕自評：<br>'+
      '<button class="iconbtn green" id="self" style="background:linear-gradient(135deg,#b7e58c,#82cf5f);color:#fff">✅ 我念得很棒</button></div>';
    document.getElementById('self').onclick=function(){ q.ok=true; q.fallback=true; sndRight(); confetti(); goNext(); };
    return;
  }
  if(q._listening || q._done || q.tries>=4) return;
  q._listening=true;
  ensureMic(function(micOk){
    if(document.getElementById('mic')!==btn)return;
    if(!micOk){ q._listening=false; micFailUI(fb,btn,q); return; }
    startRecCore();
  });
  function startRecCore(){
  if(window.speechSynthesis)speechSynthesis.cancel();
  var r=new SR(); CUR_SR=r;
  r.lang='en-US'; r.interimResults=false; r.maxAlternatives=5;
  var finished=false;
  btn.classList.add('rec'); btn.textContent='🎙 聽力中...請念出單字';
  fb.innerHTML='<span style="color:#a58cc7">....</span>';
  r.onresult=function(e){
    var alts=[]; for(var i=0;i<e.results[0].length;i++) alts.push(e.results[0][i].transcript);
    finished=true; handle(alts);
  };
  r.onerror=function(e){
    if(finished) return; finished=true;
    if(e.error==='not-allowed'||e.error==='audio-capture'){
      fb.innerHTML='<span class="no">還沒有拿到麥克風權限 😢</span>';
      document.getElementById('hintarea').innerHTML=
        '<div class="hintbox">請點網址列左邊的 🔒（或 🎤／鎖頭圖示）→「麥克風」→ <b>允許</b>，<br>再按下面按鈕重新載入一次：<br>'+
        '<button class="iconbtn" id=\"reload\" style=\"background:linear-gradient(135deg,#8ecdff,#5aa9f5);color:#fff\">🔄 重新載入再試</button><br><br>'+
        '如果這台裝置真的不能錄音，也可以用自評模式：<br>'+
        '<button class="iconbtn" id="self" style="background:linear-gradient(135deg,#b7e58c,#82cf5f);color:#fff">✅ 我念得很棒（自評）</button></div>';
      document.getElementById('reload').onclick=function(){ location.reload(); };
      document.getElementById('self').onclick=function(){ q.ok=true; q.fallback=true; sndRight(); confetti(); goNext(); };
      restore(btn);
    }else{
      fb.innerHTML='<span class="no">聽不清楚，再試一次喔 🎤</span>';
      restore(btn);
    }
  };
  r.onend=function(){
    if(finished) return; finished=true;
    if(!q._got){ fb.innerHTML='<span class="no">沒有聽到聲音，再試一次 🎤</span>'; restore(btn); }
  };
  try{ r.start(); }catch(err){ fb.innerHTML='<span class="no">錄音啟動失敗</span>'; restore(btn); }
  if(navigator.vibrate) navigator.vibrate(40);

  function handle(alts){
    q.tries++;
    var hit=false, said=alts[0]||'';
    for(var i=0;i<alts.length;i++){ if(matchSay(w.e,alts[i])){ hit=true; said=alts[i]; break; } }
    if(hit){
      q.ok=true; q._done=true; q.firstTry=(q.tries===1);
      sndRight(); confetti();
      praise(PRAISE[rnd(PRAISE.length)]);
      fb.innerHTML='<span class="ok">✔ 太棒了！電腦聽懂你念「'+esc(said)+'」</span>';
      restore(btn);
      later(goNext,1600);
    }else{
      sndWrong();
      fb.innerHTML='<span class="no">✖ 電腦聽到「'+esc(said||'（沒有聽清楚）')+'」</span>';
      showHint(q,w);
      restore(btn);
      if(q.tries>=4){q._done=true;btn.disabled=true;fb.innerHTML+='<br>再練習一次，下題繼續加油！';later(goNext,2200);}
    }
  }
  function restore(b){ restoreBtn(btn,q); }
  }
}

function showHint(q,w){
  var hint=document.getElementById('hintarea');
  var letters=w.e.replace(/[a-z0-9]/gi,function(ch){ return ch; });
  hint.innerHTML='<div class="hintbox">💡 發音小提示：<br>① 第一個字母是「<b>'+esc(w.e[0])+'</b>」，一共 '+compact(w.e).length+' 個字母<br>'+
    '② 跟著電腦念一次：'+esc(letters)+'<br>'+
    '③ '+esc(w.c)+'<br>'+
    '還有 '+Math.max(0,4-q.tries)+' 次機會，再試試看！</div>'+
    '<div style="text-align:center"><button class="iconbtn" id="slow2">🐢 再慢速聽一次</button></div>';
  document.getElementById('slow2').onclick=function(){ say(w.e,'en-US',0.6); };
}

/* ---------- 單組結果 ---------- */
function groupResult(){
  var g=S.qs, score=0, first=0;
  g.forEach(function(q){ if(q.ok) score++; if(q.firstTry) first++; });
  var k=key();
  var prev=S.done[k];
  if(!prev || score>prev.score) S.done[k]={score:score, firstTry:first, details:g.map(function(q){ return {w:q.w, ok:q.ok, firstTry:q.firstTry, fallback:q.fallback}; })};
  REV++;SYNC.ok=false;saveProgress();
  if(score>=8) sndWin();
  var rows=g.map(function(q,j){
    return '<div style="display:flex;justify-content:space-between;align-items:center;background:'+(q.ok?'#f2fff0':'#fff5f5')+
      'border-radius:14px;padding:8px 12px;margin:4px 0;font-weight:800">'+
      '<span class="review-word">'+(j+1)+'. <b style="font-family:Baloo 2">'+esc(WORDS[q.w].e)+'</b> '+esc(WORDS[q.w].c)+
      (S.sec.id==='spell'&&wordFormNote(WORDS[q.w])?'<small class="review-example">句中拼字：'+esc(spellingForm(WORDS[q.w]))+'</small>':'')+
      (WORDS[q.w].sentence?'<small class="review-example" lang="en">'+esc(WORDS[q.w].sentence)+'</small>':'')+'</span>'+
      '<span style="font-size:20px">'+(q.ok?(q.fallback?'✅ 自評':q.firstTry?'🌟':'✔'):'✖')+'</span></div>';
  }).join('');
  var msg = score>=10?'滿分！你是單字王 👑':(score>=8?'超棒的！🌟':(score>=5?'不錯喔，再加油 💪':'多練幾次就會了 🌱'));
  go(
    '<div class="card" style="text-align:center">'+
      '<div class="trophy">'+(score>=8?'🏆':'🎈')+'</div>'+
      '<div class="title" style="font-size:26px">'+S.sec.name+'第'+(S.gid+1)+'組 完成！</div>'+
      '<p class="sub">'+msg+'</p>'+
      '<div style="font-size:46px;font-weight:900;color:#ff6fae">'+score+' <span style="font-size:22px;color:#a58cc7">/ 10</span></div>'+
      '<p class="mini">🌟 一次答對 '+first+' 題</p>'+
      '<p class="mini" id="gsync">☁️ 成績同步中…</p><div class="divider"></div>'+rows+
      '<button class="bigbtn" id="mg">繼續挑戰（回'+S.sec.name+'選組）</button>'+
      '<button class="bigbtn gray" id="mn">🏠 回主選單</button>'+
      (allDone()?'<button class="bigbtn green" id="rv">🎉 看我的總成績單</button>':'')+
    '</div>',
    function(){
      document.getElementById('mg').onclick=groups;
      document.getElementById('mn').onclick=menu;
      var rv=document.getElementById('rv'); if(rv) rv.onclick=report;
      confetti();
      /* 每組完成 → 自動存進老師的表格 */
      syncScore(function(ok){
        var el=document.getElementById('gsync');
        if(el) el.textContent = ok ? '☁️ 成績已自動存入老師的表格 ✓' : '⚠️ 同步失敗（'+SYNC.msg+'），到成績單可再按同步';
      });
    }
  );
}

/* ---------- 總成績單 ---------- */
function report(){
  var d = buildPayload();
  var cells=d.cells, total=d.total, cnt=d.cnt, wrong=d.wrongArr, firstTotal=d.firstTotal, pct=d.pct, comment=d.comment;
  var table='<table class="score"><tr><th>關卡</th>';
  for(var c=1;c<=4;c++) table+='<th>第'+c+'組</th>';
  table+='<th>小計</th></tr>';
  SECTIONS.forEach(function(sec){
    table+='<tr><th>'+sec.icon+sec.name+'</th>';
    var sub=0, subCnt=0;
    for(var g2=1;g2<=4;g2++){
      var r2=S.done['s'+sec.n+'_'+g2];
      if(r2){
        sub+=r2.score; subCnt++;
        var cls= r2.score>=10?'g10':(r2.score>=7?'g7':'g0');
        table+='<td class="'+cls+'">'+r2.score+'<div style="font-size:11px">'+(r2.score>=10?'🌟':'')+'</div></td>';
      }else{
        table+='<td style="color:#cbb">未測</td>';
      }
    }
    table+='<td>'+(subCnt?sub+'/'+(subCnt*10):'—')+'</td></tr>';
  });
  table+='</table>';
  var finalBlock = allDone()
    ? '<div class="trophy">👑</div><div class="title" style="font-size:26px">'+esc(S.name)+' 的總成績單</div>'
    : '<div class="title" style="font-size:24px">'+esc(S.name)+' 的成績單（還沒考完）</div>';
  go(
    '<div class="card">'+
      finalBlock+
      '<p class="sub">已完成 '+cnt+'/12 組</p>'+
      '<div style="font-size:52px;font-weight:900;text-align:center;color:#ff6fae">'+total+
        '<span style="font-size:24px;color:#a58cc7"> / '+120+'</span></div>'+
      '<p class="sub">'+(cnt?'總分達成率 '+pct+'%　'+comment:'還沒有成績喔')+'</p>'+
      '<p class="mini">🌟 一次答對 '+firstTotal+' 題　・　'+(wrong.length?('需要再練習 '+wrong.length+' 個單字'):cnt?'全部答對，太強了！':'')+'</p>'+
      '<div class="divider"></div>'+table+
      (wrong.length? '<div class="divider"></div><b style="color:#d84f92">📕 需要再練習的單字：</b><div class="wronglist">'+
        wrong.map(function(t){ return '・'+esc(t); }).join('<br>')+'</div>':'')+
      '<div class="divider"></div>'+
      (cnt? '<p class="sub" id="syncstate">'+(SYNC.ok?'✅ '+esc(SYNC.msg)+(SYNC.time?'（'+SYNC.time+'）':''):'⚠️ '+esc(SYNC.msg))+'</p>'+
            '<button class="bigbtn green" id="send">☁️ 立即同步給老師</button><p class="mini" id="sendmsg"></p>':'')+
      '<button class="bigbtn" id="mn">🏠 回主選單繼續挑戰</button>'+
    '</div>',
    function(){
      document.getElementById('mn').onclick=menu;
      var sb=document.getElementById('send');
      if(sb) sb.onclick=function(){
        sb.disabled=true; sb.textContent='同步中...';
        document.getElementById('sendmsg').textContent='';
        syncScore(function(ok){
          var st=document.getElementById('syncstate');
          if(st) st.textContent = ok ? '✅ '+SYNC.msg+(SYNC.time?'（'+SYNC.time+'）':'') : '⚠️ '+SYNC.msg;
          if(ok) sndWin();
          sb.disabled=false; sb.textContent='☁️ 立即同步給老師';
        });
      };
    }
  );
}

/* ================= 啟動 ================= */
if(window.speechSynthesis) speechSynthesis.getVoices();
window.addEventListener('pagehide',function(){stopRec();if(MIC_STREAM){MIC_STREAM.getTracks().forEach(function(t){t.stop();});MIC_STREAM=null;}});
document.title=GAME_TITLE+' 🎮';
/* 手機裡有存過進度 → 直接回到上次的進度接著玩；沒有 → 顯示首頁輸入名字 */
if(loadProgress()){menu();if(totalDone()&&!SYNC.ok)syncScore();}else{home();}
</script>
